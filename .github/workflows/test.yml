name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Движок и данные глав
        run: npm test
      - name: Установить браузер
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Дымовой тест интерфейса
        run: npm run test:smoke
